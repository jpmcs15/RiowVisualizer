name: Build Riow Visualizer VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure with CMake
        run: cmake -S . -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "RiowVisualizer.vst3" | Select-Object -First 1
          if (-not $plugin) {
            Write-Error "RiowVisualizer.vst3 bundle not found after build."
            Get-ChildItem build -Recurse | Select-Object -First 100 FullName
            exit 1
          }
          Compress-Archive -Path $plugin.FullName -DestinationPath "$env:GITHUB_WORKSPACE\RiowVisualizer-VST3-Windows.zip" -Force
      - name: Upload compiled VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiowVisualizer-VST3-Windows
          path: RiowVisualizer-VST3-Windows.zip
          if-no-files-found: error
          retention-days: 14
